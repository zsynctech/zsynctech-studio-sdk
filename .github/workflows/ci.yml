name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check src examples tests

      - name: Format check (ruff format)
        run: uv run ruff format --check src examples tests

      - name: Type check (mypy --strict)
        run: uv run mypy src examples tests

      - name: Tests
        run: uv run pytest -q
