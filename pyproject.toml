[project]
name = "zsynctech-sdk"
version = "1.4.9"
description = "SDK Python para conectar robôs (RPA) à plataforma zsynctech-studio via Socket.IO"
readme = "README.md"
authors = [
    { name = "Rodrigo Zavan", email = "rodrigo.zavan@zsynctech.com.br" }
]
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7",
    "pydantic>=2.9",
    "python-socketio[client]>=5.11",
    "requests>=2.31",
]

[project.scripts]
zsynctech-sdk = "zsynctech_studio_sdk:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

# The importable module stays zsynctech_studio_sdk (src/zsynctech_studio_sdk/) even though the
# distribution was renamed to zsynctech-sdk on PyPI (the old "zsynctech-studio-sdk" name is
# stuck on a PyPI account we lost access to) - uv_build otherwise infers the module name from
# the project name (hyphens to underscores), which would no longer match this package's actual
# directory. Keeping the import path the same means every robot that already does
# `from zsynctech_studio_sdk import ...` only needs its pyproject.toml dependency line updated,
# not a single import statement.
[tool.uv.build-backend]
module-name = "zsynctech_studio_sdk"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.7",
    "types-requests>=2.31",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "socketio.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
