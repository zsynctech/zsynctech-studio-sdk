[project]
name = "zsynctech-studio-sdk"
version = "1.3.22"
description = "SDK Python para integração de robôs (RPA) com o ZSync Tech Studio"
readme = "README.md"
authors = [
    { name = "Rodrigo Zavan", email = "rodrigozavan104@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
zsyncstudio = "zsyncstudio:main"

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "zsyncstudio"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "coverage>=7.15.2",
    "mypy>=1.14.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "respx>=0.22.0",
    "ruff>=0.9.0",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Os testes aninham `with execution: / with task:` de propósito, espelhando o
# padrão real de uso (execução contendo várias tasks) — não é o mesmo caso
# que SIM117 normalmente flagra.
"tests/*" = ["SIM117"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
